<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SHINE SKIN · 대표 화면 비교</title><meta name="robots" content="noindex,nofollow"><style>
@font-face{font-family:Pretendard;src:url('shine-skin/fonts/Pretendard-Regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#dfe8ec;color:#17313a;font-family:Pretendard,'Malgun Gothic',sans-serif}button,a{font:inherit;color:inherit}a{text-decoration:none}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#f9fcfdf2;backdrop-filter:blur(20px);padding:17px 28px;border-bottom:1px solid #bdcfd8}h1{font-size:18px;margin:0;font-weight:500}header p{margin:4px 0 0;font-size:12px;color:#526976}.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}button{border:1px solid #b5cbd6;border-radius:100px;background:transparent;padding:10px 17px;font-size:13px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#1e5969;color:white;border-color:#1e5969}a{font-size:12px;padding:12px}button:focus-visible,a:focus-visible{outline:3px solid #226b81;outline-offset:3px}main{padding:24px;display:grid;gap:24px;align-items:start;grid-template-columns:minmax(0,1fr) 390px;max-width:2100px;margin:auto}.frame-panel{min-width:0}.frame-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:12px;color:#425e6c}.frame-viewport{position:relative;width:100%;background:#f4fafc;box-shadow:0 10px 40px #17313a15;border:1px solid #b4c9d4;overflow:hidden;border-radius:16px}iframe{display:block;border:0;transform-origin:top left;background:#f4fafc;max-width:none}body[data-mode=desktop] main{display:block;max-width:1490px}body[data-mode=desktop] #mobile-panel{display:none}body[data-mode=mobile] main{display:block;max-width:438px}body[data-mode=mobile] #desktop-panel{display:none}body[data-mode=compare] #desktop-panel{position:sticky;top:121px}footer{text-align:center;font-size:12px;padding:20px;color:#526976}@media(max-width:1000px){main{grid-template-columns:minmax(0,1fr) 320px;padding:16px;gap:16px}header{padding:14px 18px}h1{font-size:16px}.controls{gap:4px}button{padding:8px 12px}}@media(max-width:760px){body[data-mode=compare] main{display:block}body[data-mode=compare] #desktop-panel{position:static;margin-bottom:28px}body[data-mode=compare] #mobile-panel{max-width:390px;margin:auto}header p{font-size:11px}}
</style></head><body data-mode="compare"><header><div><h1>SHINE SKIN · 대표 화면 비교</h1><p>헤더 · 히어로 · 제품 추천 — 각 화면에서 직접 선택하고 눌러볼 수 있어요.</p></div><div class="controls" aria-label="화면 비교 방식"><button data-mode="compare" aria-pressed="true">함께 보기</button><button data-mode="desktop" aria-pressed="false">데스크톱</button><button data-mode="mobile" aria-pressed="false">모바일</button><a href="shine-skin/" target="_blank" rel="noopener">전체 화면 열기 ↗</a></div></header><main><section id="desktop-panel" class="frame-panel"><div class="frame-label"><span>DESKTOP</span><span>1440 × 1000</span></div><div class="frame-viewport" id="desktop-viewport"><iframe id="desktop-frame" title="SHINE SKIN 데스크톱 화면" src="shine-skin/" width="1440" height="1000"></iframe></div></section><section id="mobile-panel" class="frame-panel"><div class="frame-label"><span>MOBILE</span><span>390 × 844</span></div><div class="frame-viewport" id="mobile-viewport"><iframe id="mobile-frame" title="SHINE SKIN 모바일 화면" src="shine-skin/" width="390" height="844"></iframe></div></section></main><footer>각 화면 안에서 아래로 스크롤하면 제품 추천 영역이 이어집니다.</footer><script>
const frames=[['desktop',1440,1000],['mobile',390,844]];
function fit(){for(const [name,w,h] of frames){const viewport=document.getElementById(name+'-viewport');if(!viewport.clientWidth)continue;const scale=viewport.clientWidth/w;document.getElementById(name+'-frame').style.transform='scale('+scale+')';viewport.style.height=h*scale+'px';}}
document.querySelectorAll('button[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.mode=button.dataset.mode;document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));fit();}));new ResizeObserver(fit).observe(document.querySelector('main'));window.addEventListener('resize',fit);fit();
</script></body></html>
